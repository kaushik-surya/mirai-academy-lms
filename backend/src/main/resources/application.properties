# JWT Configuration
app.jwt.secret=miraiAcademySecretKeyForJWTTokenGenerationAndValidation2024VerySecureKeyForAcademyLMS
app.jwt.expiration-ms=86400000

# Mail Configuration (update with actual values)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@miraiacademy.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Logging
logging.level.com.miraiacademy=DEBUG
